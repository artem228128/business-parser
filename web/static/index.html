<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Handelskaart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,640&family=Outfit:wght@360;500;640&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="stylesheet" href="/vendor/MarkerCluster.css" />
  <link rel="stylesheet" href="/vendor/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="panel">
      <div class="panel-filters">
      <header class="brand">
        <div class="brand-row">
          <div>
            <p class="kicker" data-i18n="kicker">Open register · OSM</p>
            <h1>Handelskaart</h1>
          </div>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="ru">RU</button>
          </div>
        </div>
      </header>

      <label class="search">
        <span class="sr" data-i18n="search">Search</span>
        <input id="q" type="search" data-i18n-placeholder="searchPh" placeholder="Name, street, industry…" autocomplete="off" />
        <kbd>/</kbd>
      </label>

      <div class="filter-stack">
        <label class="combo-field">
          <span data-i18n="category">Category</span>
          <div class="combo-input-wrap">
            <input id="category" type="text" autocomplete="off" spellcheck="false" />
            <button type="button" class="combo-clear hidden" data-clear="category" data-i18n-aria="clear" aria-label="Clear">×</button>
          </div>
          <ul id="category-suggest" class="suggest hidden" role="listbox"></ul>
        </label>
        <label class="combo-field">
          <span data-i18n="type">Type</span>
          <div class="combo-input-wrap">
            <input id="industry" type="text" autocomplete="off" spellcheck="false" />
            <button type="button" class="combo-clear hidden" data-clear="industry" data-i18n-aria="clear" aria-label="Clear">×</button>
          </div>
          <ul id="industry-suggest" class="suggest hidden" role="listbox"></ul>
        </label>
        <label class="combo-field city-field">
          <span data-i18n="city">City</span>
          <div class="combo-input-wrap">
            <input id="city" type="text" data-i18n-placeholder="cityPh" placeholder="Start typing a city" autocomplete="off" spellcheck="false" />
            <button type="button" class="combo-clear hidden" data-clear="city" data-i18n-aria="clear" aria-label="Clear">×</button>
          </div>
          <ul id="city-suggest" class="suggest hidden" role="listbox"></ul>
        </label>
        <label>
          <span data-i18n="sort">Sort</span>
          <select id="sort">
            <option value="name" data-i18n="sortName">Name A–Z</option>
            <option value="contacts" data-i18n="sortContacts">Most complete contacts</option>
            <option value="city" data-i18n="sortCity">City A–Z</option>
            <option value="industry" data-i18n="sortIndustry">Type A–Z</option>
          </select>
        </label>
      </div>

      <fieldset class="must">
        <legend data-i18n="must">Must have</legend>
        <label><input type="checkbox" data-flag="has_website" /> <span data-i18n="website">Website</span></label>
        <label><input type="checkbox" data-flag="has_email" /> <span data-i18n="email">Email</span></label>
        <label><input type="checkbox" data-flag="has_phone" /> <span data-i18n="phone">Phone</span></label>
        <label><input type="checkbox" data-flag="has_kvk" /> <span data-i18n="kvk">KVK number</span></label>
      </fieldset>

      <div class="meta-row">
        <p id="count" data-i18n="loading">Loading atlas…</p>
        <button type="button" id="reset" class="ghost" data-i18n="reset">Reset</button>
      </div>
      </div>

      <div class="panel-sheet">
        <div
          class="panel-split"
          id="panel-split"
          role="separator"
          aria-orientation="horizontal"
          aria-valuemin="120"
          aria-valuemax="600"
          tabindex="0"
        >
          <span class="panel-split-bar" aria-hidden="true"></span>
        </div>
        <div class="panel-results">
          <div id="selected-pill" class="selected-pill hidden" role="status"></div>
          <div id="results" class="results"></div>
          <div class="pager">
            <button type="button" id="prev" data-i18n="prev" disabled>Prev</button>
            <span id="page"></span>
            <button type="button" id="next" data-i18n="next" disabled>Next</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="mapwrap">
      <div id="map"></div>
      <div id="hint" class="hint hidden"></div>
      <article id="detail" class="detail hidden"></article>
    </main>
    <nav class="viewbar" aria-label="View">
      <button type="button" data-view="list" class="on" data-i18n="viewList">List</button>
      <button type="button" data-view="map" data-i18n="viewMap">Map</button>
    </nav>
  </div>
  <script src="/vendor/leaflet.js"></script>
  <script src="/vendor/leaflet.markercluster.js"></script>
  <script src="/app.js"></script>
</body>
</html>
